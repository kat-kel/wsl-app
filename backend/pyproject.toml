[project]
name = "wsl-backend"
version = "0.1.0"
description = "FastAPI backend for wsl"
requires-python = ">=3.14"
dependencies = [
	"alembic>=1.19.2",
	"fastapi>=0.141.1",
	"psycopg[binary]>=3.3.5",
	"pydantic>=2.13.5",
	"pydantic-settings>=2.15.0",
	"python-dotenv>=1.2.3",
	"python-multipart>=0.0.32",
	"sqlmodel>=0.0.42",
	"starlette>=1.6.0",
	"uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "app"

[tool.ruff]
src = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[dependency-groups]
dev = [
	"click>=8.5.0",
	"httpx2>=2.12.0",
	"pytest>=8.4.2",
	"ruff>=0.16.6",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
]
markers = [
    "integration: tests that depend on the database being ready",
]
