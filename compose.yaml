# For local development only. The Cloud deployments will read backend and frontend's Dockerfiles.
services:
  db:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-app} -d $${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    command:
      - /app/backend/.venv/bin/uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "${BACKEND_PORT:-8000}"
      - --reload
    working_dir: /app
    environment:
      # PORT is intentionally not set here: the command: above already passes
      # --port explicitly, and config.py's AppSettings doesn't read PORT anyway.
      # It's only consumed by Dockerfile.backend's own CMD, which this compose
      # file never runs (only Cloud Run does).
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app@db:5432/app}
      BACKEND_URL: ${BACKEND_URL:-http://backend:${BACKEND_PORT:-8000}}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-5173}}
    volumes:
      - ./backend/src:/app/backend/src
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      # PORT is set here becasue the local Vite config reads it 
      PORT: ${FRONTEND_PORT:-5173}
      VITE_API_URL: ${VITE_API_URL:-http://backend:${BACKEND_PORT:-8000}}
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    depends_on:
      - backend

volumes:
  frontend-node-modules:
  postgres-data:
