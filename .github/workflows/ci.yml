name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
      CORS_ORIGINS: http://localhost:5173
      # Not a secret: CI runs against a throwaway Postgres service container.
      WRITE_API_KEYS: ci-write-api-key-0123456789abcdef
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - name: Apply migrations
        run: uv run alembic -c ../alembic.ini upgrade head
      - name: Verify models match migrations
        run: uv run alembic -c ../alembic.ini check
      - name: Verify migrations reverse cleanly
        run: |
          uv run alembic -c ../alembic.ini downgrade base
          uv run alembic -c ../alembic.ini upgrade head
      - run: uv run pytest
      - run: uv run python -c "import fastapi, sqlmodel, alembic"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.backend
          push: false
          tags: wsl-backend:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.frontend
          push: false
          tags: wsl-frontend:ci
